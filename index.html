function openViewer(id,noteMode=false,n=null,component=''){current=find(id)||null;editing=n?n.id:null;pin=n&&n.point?{...n.point}:null;$('viewer-title').textContent=current?current.title[lang]:t('general');$('note-component').value=n?n.component:component;$('note-category').value=n?n.category:'position';$('note-text').value=n?n.text:'';$('note-feedback').textContent='';$('zoom').value='100';$('viewport').hidden=!current;$('no-image').hidden=!!current;document.querySelector('.zoom-bar').hidden=!current;$('pick-hint').hidden=!current;$('clear-point').hidden=!current;if(current){$('viewer-image').src=current.files[lang];$('viewer-image').alt=current.title[lang];$('full-image').href=current.files[lang]}setPicking(noteMode&&!!current);showPin();$('viewer').showModal();requestAnimationFrame(()=>{fitImage();$('viewport').scrollTo(0,0);if(noteMode&&!current)$('note-text').focus()})}
$('viewer-image').onload=fitImage;window.addEventListener('resize',fitImage);$('zoom').oninput=fitImage;$('pick-point').onclick=()=>setPicking(!picking);$('picture').onclick=e=>{if(!picking||!current)return;const r=$('viewer-image').getBoundingClientRect();pin={x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))};showPin();setPicking(false);$('note-text').focus()};$('clear-point').onclick=()=>{pin=null;showPin()};$('close-viewer').onclick=()=>$('viewer').close();
$('note-form').onsubmit=e=>{e.preventDefault();const text=$('note-text').value.trim();if(!text){$('note-feedback').textContent=t('required');return}const old=notes.find(n=>n.id===editing);const n={id:editing||(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)),resource:current?current.id:'general',component:$('note-component').value.trim().toUpperCase(),category:$('note-category').value,text,point:pin?{...pin}:null,status:old?old.status:'open',createdAt:old?old.createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),language:lang};if(!validNote(n))return;if(old)notes=notes.map(x=>x.id===n.id?n:x);else notes.push(n);persist();renderNotes();$('viewer').close();$('review-feedback').textContent=t('saved');$('review').scrollIntoView({behavior:'smooth'})};
function categoryText(c){return t({position:'catPosition',value:'catValue',image:'catImage',text:'catText',other:'catOther'}[c])}
function renderNotes(){$('nav-count').textContent=notes.filter(n=>n.status==='open').length;$('review-count').textContent='('+notes.length+')';$('review-list').innerHTML=notes.length?notes.map(n=>`<article class="review-item ${n.status==='done'?'done':''}"><div class="review-top"><strong>${esc(n.resource==='general'?t('general'):find(n.resource).title[lang])}${n.component?' · '+esc(n.component):''}</strong><span>${t(n.status==='done'?'done':'open')}</span></div><div class="muted">${categoryText(n.category)} · ${n.point?`${t('point')}: ${(n.point.x*100).toFixed(1)}%, ${(n.point.y*100).toFixed(1)}%`:t('noPoint')}</div><p>${esc(n.text)}</p><div class="tools"><button type="button" data-edit="${esc(n.id)}">${t('edit')}</button><button type="button" data-resolve="${esc(n.id)}">${t(n.status==='done'?'reopen':'resolve')}</button><button type="button" data-remove="${esc(n.id)}">${t('remove')}</button></div></article>`).join(''):`<div class="empty">${t('empty')}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open)openViewer(b.dataset.open);if(b.dataset.note)openViewer(b.dataset.note,true);if(b.dataset.component){const r=RESOURCES.find(a=>a.group==='maps'&&a.ids.includes(b.dataset.component));openViewer(r?r.id:'general',true,null,b.dataset.component)}if(b.dataset.edit){const n=notes.find(x=>x.id===b.dataset.edit);if(n)openViewer(n.resource,true,n)}if(b.dataset.resolve){notes=notes.map(n=>n.id===b.dataset.resolve?{...n,status:n.status==='done'?'open':'done',updatedAt:new Date().toISOString()}:n);persist();renderNotes()}if(b.dataset.remove){deleted=notes.find(n=>n.id===b.dataset.remove);notes=notes.filter(n=>n.id!==b.dataset.remove);persist();renderNotes();$('undo').hidden=false;$('review-feedback').textContent=t('deleted')}});
$('undo').onclick=()=>{if(deleted&&!notes.some(n=>n.id===deleted.id)){notes.push(deleted);persist();renderNotes()}deleted=null;$('undo').hidden=true;$('review-feedback').textContent=''};
$('new-general').onclick=()=>openViewer('general',true);$('map-bottom').onclick=()=>{side='bottom';renderMaps()};$('map-top').onclick=()=>{side='top';renderMaps()};for(const l of ['pl','en'])$('lang-'+l).onclick=()=>{lang=l;translate()};for(const id of ['search','side-filter','status-filter'])$(id).addEventListener(id==='search'?'input':'change',renderTable);
function exportPayload(){return {schemaVersion:1,project:PROJECT,version:'0.3',exportedAt:new Date().toISOString(),notes}}
$('export-notes').onclick=()=>{const blob=new Blob([JSON.stringify(exportPayload(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='HGK-010-poprawki-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('review-feedback').textContent=t('exported')};
function importPayload(d){if(!d||d.schemaVersion!==1||d.project!==PROJECT||!Array.isArray(d.notes)||d.notes.length>500||!d.notes.every(validNote)||new Set(d.notes.map(n=>n.id)).size!==d.notes.length)throw Error('invalid');const merged=new Map(notes.map(n=>[n.id,n]));for(const n of d.notes)merged.set(n.id,{id:n.id,resource:n.resource,component:n.component,category:n.category,text:n.text,point:n.point?{x:n.point.x,y:n.point.y}:null,status:n.status,createdAt:typeof n.createdAt==='string'?n.createdAt:new Date().toISOString(),updatedAt:typeof n.updatedAt==='string'?n.updatedAt:new Date().toISOString(),language:n.language==='en'?'en':'pl'});if(merged.size>500)throw Error('limit');notes=Array.from(merged.values());persist();renderNotes()}
$('import-notes').onclick=()=>$('import-file').click();$('import-file').onchange=async()=>{const file=$('import-file').files[0];if(!file)return;try{if(file.size>4000000)throw Error('size');importPayload(JSON.parse(await file.text()));$('review-feedback').textContent=t('imported')}catch(e){$('review-feedback').textContent=t('invalid')}finally{$('import-file').value=''}};

Object.assign(TXT.en,{resetView:'Whole board',mapHelp:'Tap a component or choose from the list. Two fingers: zoom · one finger: pan.',mapSearch:'Search component or value…',selectPart:'Select component',selectedPart:'Selected component',closePart:'Close component card',controller:'Module Controller / Analog Interface',memory:'SPI Calibration Memory · 8-pin · 1.8 V',focusPart:'Show on map',mapLabel:'Interactive PCB map',zoomIn:'Zoom in',zoomOut:'Zoom out',navigation:'Navigation',noMapped:'This component’s position has not been matched yet.',mapIntro:'Select a component on the PCB or from the list. The map will zoom to its location.',dbIntro:'42 documentation entries. Confirmed values and mapped locations are available in the database.',thanks:'Special thanks to Lewy2041 for the inspiration and encouragement to create my own projects and tools.',icType:'Module Controller / Analog Interface',memoryType:'SPI Calibration Memory · 8-pin · 1.8 V'});
const displayID=id=>id==='X10'?'X010':id;
let selectedPart=null,mapQuery='',mapView=null,boardPointers=new Map(),gesture=null,moved=false;
function componentData(id){return COMPONENTS.find(c=>c.ID===id)}
function partDescription(r){return r.ID==='U1'?t('controller'):r.ID==='U2'?t('memory'):typeText(r)}
function renderMaps(){
 const spec=MAPS[side],r=find(side);
 $('map-card').innerHTML=`<article class="card board-card"><div class="card-head"><h3>${esc(r.title[lang])}</h3><div class="tools"><button data-zoom="out" aria-label="${t('zoomOut')}">−</button><output id="board-zoom">100%</output><button data-zoom="in" aria-label="${t('zoomIn')}">+</button><button id="board-reset">${t('resetView')}</button><button data-note="${side}">${t('suggest')}</button><a href="${r.files[lang]}" download>${t('download')}</a></div></div><div class="board-workspace"><div class="board-main"><div id="board-viewport" class="board-viewport" aria-label="${t('mapLabel')}"><div id="board-stage" class="board-stage"><img src="${spec.photo}" alt="${esc(r.title[lang])}" draggable="false"><svg id="board-overlay" viewBox="0 0 ${spec.width} ${spec.height}" aria-label="${t('selectPart')}">${Object.entries(spec.bounds).map(([id,b])=>{const c=componentData(id);return `<g class="hotspot" data-part="${id}" role="button" tabindex="0" aria-label="${esc(displayID(id)+' · '+valueText(c)+' · '+partDescription(c))}"><title>${esc(displayID(id)+' · '+valueText(c)+' · '+partDescription(c))}</title><rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="2" vector-effect="non-scaling-stroke"/><text x="${b[0]}" y="${b[1]-5}">${displayID(id)}</text></g>`}).join('')}</svg></div></div><p class="board-hint">${t('mapHelp')}</p><aside id="selected-card" class="selected-card" hidden aria-live="polite"></aside></div><aside class="board-list"><label for="board-search">${t('selectPart')}</label><input id="board-search" type="search" placeholder="${t('mapSearch')}" value="${esc(mapQuery)}"><div id="board-results"></div></aside></div></article>`;
 for(const s of ['bottom','top']){$('map-'+s).classList.toggle('on',s===side);$('map-'+s).setAttribute('aria-pressed',String(s===side))}
 renderBoardList();$('board-search').oninput=e=>{mapQuery=e.target.value;renderBoardList()};
 $('board-reset').onclick=()=>{resetBoard();};document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoomBoard(b.dataset.zoom==='in'?1.4:1/1.4));
 installBoardGestures();if(!mapView||mapView.side!==side)resetBoard();else applyBoardView();renderSelection();
}
function renderBoardList(){const q=mapQuery.toLowerCase().trim();const rows=COMPONENTS.filter(c=>[c.ID,displayID(c.ID),valueText(c),partDescription(c)].join(' ').toLowerCase().includes(q));$('board-results').innerHTML=rows.length?rows.map(c=>`<button class="part-row ${selectedPart===c.ID?'active':''}" data-focus-part="${c.ID}" type="button" aria-pressed="${selectedPart===c.ID}"><b>${displayID(c.ID)}</b><span>${esc(valueText(c))}</span><small>${esc(partDescription(c))}</small></button>`).join(''):`<p class="muted">${t('noResults')}</p>`;}
function resetBoard(){const vp=$('board-viewport'),m=MAPS[side];const scale=Math.min((vp.clientWidth-24)/m.width,(vp.clientHeight-24)/m.height);mapView={side,scale,base:scale,x:(vp.clientWidth-m.width*scale)/2,y:(vp.clientHeight-m.height*scale)/2};applyBoardView()}
function applyBoardView(){if(!mapView||!$('board-stage'))return;const m=MAPS[side];$('board-stage').style.width=m.width+'px';$('board-stage').style.height=m.height+'px';$('board-stage').style.transform=`translate(${mapView.x}px,${mapView.y}px) scale(${mapView.scale})`;$('board-zoom').value=Math.round(mapView.scale/mapView.base*100)+'%';}
function setZoom(scale,x,y){const v=mapView;scale=Math.max(v.base,Math.min(v.base*12,scale));const k=scale/v.scale;v.x=x-(x-v.x)*k;v.y=y-(y-v.y)*k;v.scale=scale;applyBoardView()}
function zoomBoard(factor){const vp=$('board-viewport');setZoom(mapView.scale*factor,vp.clientWidth/2,vp.clientHeight/2)}
function selectPart(id,focus=true){const target=Object.keys(MAPS).find(s=>MAPS[s].bounds[id]);selectedPart=id;if(!target){renderSelection();return}if(target!==side){side=target;mapView=null;renderMaps()}if(focus){const [x,y,w,h]=MAPS[side].bounds[id],vp=$('board-viewport');mapView.scale=Math.min(mapView.base*12,Math.max(mapView.base*2.5,Math.min(vp.clientWidth/(w+160),vp.clientHeight/(h+160))));mapView.x=vp.clientWidth/2-(x+w/2)*mapView.scale;mapView.y=vp.clientHeight/2-(y+h/2)*mapView.scale;applyBoardView()}renderSelection();}
function renderSelection(){const c=componentData(selectedPart);$('board-overlay').classList.toggle('has-selection',!!c);document.querySelectorAll('.hotspot').forEach(g=>{const active=g.dataset.part===selectedPart;g.classList.toggle('active',active);g.setAttribute('aria-pressed',String(active))});const panel=$('selected-card');panel.hidden=!c;if(c){panel.innerHTML=`<div><span class="eyebrow">${t('selectedPart')}</span><h3>${displayID(c.ID)} <span>${esc(valueText(c))}</span></h3><p>${esc(partDescription(c))}</p>${c.ID==='U1'?'<p class="mono">H2309QE3 A02</p>':''}${!MAPS[side].bounds[c.ID]?`<p>${t('noMapped')}</p>`:''}<span class="status ${c.status}">${t(c.status==='VERIFIED'?'verified':c.status==='UNKNOWN'?'unknown':'unverified')}</span><button data-component="${c.ID}">${t('suggest')}</button></div><button id="close-selected" aria-label="${t('closePart')}">×</button>`;$('close-selected').onclick=()=>{selectedPart=null;renderSelection()}}renderBoardList();document.querySelectorAll('#component-rows tr').forEach(row=>row.classList.toggle('active-row',row.dataset.id===selectedPart));}
function installBoardGestures(){const vp=$('board-viewport');boardPointers.clear();gesture=null;const pos=e=>{const b=vp.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};const snapshot=()=>{const pts=[...boardPointers.values()];return{view:{...mapView},pts,center:pts.length===2?{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2}:pts[0],distance:pts.length===2?Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y):0}};
 vp.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;boardPointers.set(e.pointerId,pos(e));vp.setPointerCapture(e.pointerId);gesture=snapshot();if(boardPointers.size===1)moved=false;};
 vp.onpointermove=e=>{if(!boardPointers.has(e.pointerId))return;boardPointers.set(e.pointerId,pos(e));const pts=[...boardPointers.values()];if(pts.length===1&&gesture.pts.length===1){const dx=pts[0].x-gesture.center.x,dy=pts[0].y-gesture.center.y;if(Math.hypot(dx,dy)>5)moved=true;mapView.x=gesture.view.x+dx;mapView.y=gesture.view.y+dy;applyBoardView()}else if(pts.length===2&&gesture.pts.length===2){moved=true;const cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2,dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);mapView={...gesture.view};setZoom(gesture.view.scale*dist/Math.max(1,gesture.distance),gesture.center.x,gesture.center.y);mapView.x+=cx-gesture.center.x;mapView.y+=cy-gesture.center.y;applyBoardView()}};
 vp.onpointerup=e=>{const p=pos(e);const wasTap=!moved&&boardPointers.size===1;boardPointers.delete(e.pointerId);if(wasTap){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-part]');if(target)selectPart(target.dataset.part)}if(boardPointers.size)gesture=snapshot();else gesture=null;};
 vp.onpointercancel=e=>{boardPointers.delete(e.pointerId);moved=true;gesture=boardPointers.size?snapshot():null};
 const wheel=e=>{e.preventDefault();const p=pos(e);setZoom(mapView.scale*Math.exp(-e.deltaY*.0015),p.x,p.y)};vp.addEventListener('wheel',wheel,{passive:false});
 vp.onkeydown=e=>{const g=e.target.closest('[data-part]');if(g&&['Enter',' '].includes(e.key)){e.preventDefault();selectPart(g.dataset.part)}};
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-focus-part]');if(b){selectPart(b.dataset.focusPart);if(b.closest('#component-rows'))$('maps').scrollIntoView({behavior:'smooth'})}});
window.addEventListener('resize',()=>{if($('board-viewport')){const id=selectedPart;resetBoard();if(id&&MAPS[side].bounds[id])selectPart(id)}});

$('component-ids').innerHTML=COMPONENTS.map(r=>`<option value="${r.ID}"></option>`).join('');translate();
