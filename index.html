const BOTTOM_BOUNDS={"TP1": [525, 127, 37, 37], "TP2": [402, 659, 35, 36], "R6": [180, 684, 26, 15], "C1": [330, 693, 30, 17], "X06": [177, 756, 28, 17], "U2": [219, 721, 134, 85], "R3": [545, 684, 25, 16], "R4": [608, 666, 15, 29], "R5": [635, 710, 27, 16], "C4": [716, 771, 31, 18], "TP5": [715, 800, 39, 39], "U1": [438, 741, 218, 212], "C3": [622, 965, 33, 18], "TP8": [588, 960, 23, 26], "X08": [685, 698, 37, 19], "X09": [746, 698, 16, 34], "X10": [713, 742, 38, 19]},TOP_BOUNDS={"J1": [70, 0, 735, 354], "X02": [673, 378, 19, 35], "X11": [784, 625, 33, 23], "R11": [823, 625, 38, 23], "X12": [786, 653, 31, 24], "R12": [825, 653, 22, 39], "R9": [783, 1095, 24, 38], "R8": [809, 1088, 25, 44], "X04": [784, 1140, 28, 42], "X05": [811, 1144, 25, 40], "X03": [785, 1190, 28, 42], "R10": [811, 1188, 26, 44], "X01": [694, 1244, 36, 33], "C5": [696, 1277, 36, 29], "SW2": [250, 1445, 390, 204]};

function renderMaps(){
 const spec=MAPS[side],r=find(side);
 $('map-card').innerHTML=`<article class="card board-card"><div class="card-head"><h3>${esc(r.title[lang])}</h3><div class="tools"><button data-zoom="out" aria-label="${t('zoomOut')}">−</button><output id="board-zoom">100%</output><button data-zoom="in" aria-label="${t('zoomIn')}">+</button><button id="board-reset">${t('resetView')}</button></div></div><div class="board-workspace"><div class="board-main"><div id="board-viewport" class="board-viewport" aria-label="${t('mapLabel')}"><div id="board-stage" class="board-stage"><img src="${spec.photo}" alt="${esc(r.title[lang])}" draggable="false"><svg id="board-overlay" viewBox="0 0 ${spec.width} ${spec.height}" aria-label="${t('selectPart')}">${Object.entries(spec.bounds).map(([id,b])=>{const c=componentData(id);return `<g class="hotspot" data-part="${id}" role="button" tabindex="0" aria-label="${esc(displayID(id)+' · '+valueText(c)+' · '+partDescription(c))}"><title>${esc(displayID(id)+' · '+valueText(c)+' · '+partDescription(c))}</title><rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="2" vector-effect="non-scaling-stroke"/><text x="${b[0]}" y="${b[1]-5}">${displayID(id)}</text></g>`}).join('')}</svg></div></div><p class="board-hint">${t('mapHelp')}</p><aside id="selected-card" class="selected-card" hidden aria-live="polite"></aside></div><aside class="board-list"><label for="board-search">${t('selectPart')}</label><input id="board-search" type="search" placeholder="${t('mapSearch')}" value="${esc(mapQuery)}"><div id="board-results"></div></aside></div></article>`;
 for(const s of ['bottom','top']){$('map-'+s).classList.toggle('on',s===side);$('map-'+s).setAttribute('aria-pressed',String(s===side))}

function renderBoardList(){const q=mapQuery.toLowerCase().trim();const rows=COMPONENTS.filter(c=>Object.values(MAPS).some(m=>m.bounds[c.ID])&&[c.ID,displayID(c.ID),valueText(c),partDescription(c)].join(' ').toLowerCase().includes(q));$('board-results').innerHTML=rows.length?rows.map(c=>`<button class="part-row ${selectedPart===c.ID?'active':''}" data-focus-part="${c.ID}" type="button" aria-pressed="${selectedPart===c.ID}"><b>${displayID(c.ID)}</b><span>${esc(valueText(c))}</span><small>${esc(partDescription(c))}</small></button>`).join(''):`<p class="muted">${t('noResults')}</p>`;}
function resetBoard(){const vp=$('board-viewport'),m=MAPS[side];const scale=Math.min((vp.clientWidth-24)/m.width,(vp.clientHeight-24)/m.height);mapView={side,scale,base:scale,x:(vp.clientWidth-m.width*scale)/2,y:(vp.clientHeight-m.height*scale)/2};applyBoardView()}
function applyBoardView(){if(!mapView||!$('board-stage'))return;const m=MAPS[side];$('board-stage').style.width=m.width+'px';$('board-stage').style.height=m.height+'px';$('board-stage').style.transform=`translate(${mapView.x}px,${mapView.y}px) scale(${mapView.scale})`;$('board-zoom').value=Math.round(mapView.scale/mapView.base*100)+'%';}
function setZoom(scale,x,y){const v=mapView;scale=Math.max(v.base,Math.min(v.base*12,scale));const k=scale/v.scale;v.x=x-(x-v.x)*k;v.y=y-(y-v.y)*k;v.scale=scale;applyBoardView()}
function zoomBoard(factor){const vp=$('board-viewport');setZoom(mapView.scale*factor,vp.clientWidth/2,vp.clientHeight/2)}
function selectPart(id,focus=true){const target=Object.keys(MAPS).find(s=>MAPS[s].bounds[id]);selectedPart=id;if(!target){renderSelection();return}if(target!==side){side=target;mapView=null;renderMaps()}if(focus){const [x,y,w,h]=MAPS[side].bounds[id],vp=$('board-viewport');mapView.scale=Math.min(mapView.base*12,Math.max(mapView.base*2.5,Math.min(vp.clientWidth/(w+160),vp.clientHeight/(h+160))));mapView.x=vp.clientWidth/2-(x+w/2)*mapView.scale;mapView.y=vp.clientHeight/2-(y+h/2)*mapView.scale;applyBoardView()}renderSelection();}
function renderSelection(){const c=componentData(selectedPart);$('board-overlay').classList.toggle('has-selection',!!c);document.querySelectorAll('.hotspot').forEach(g=>{const active=g.dataset.part===selectedPart;g.classList.toggle('active',active);g.setAttribute('aria-pressed',String(active))});const panel=$('selected-card');panel.hidden=!c;if(c){panel.innerHTML=`<div><span class="eyebrow">${t('selectedPart')}</span><h3>${displayID(c.ID)} <span>${esc(valueText(c))}</span></h3><p>${esc(partDescription(c))}</p>${c.ID==='U1'?'<p class="mono">H2309QE3 A02</p>':''}</div><button id="close-selected" aria-label="${t('closePart')}">×</button>`;$('close-selected').onclick=()=>{selectedPart=null;renderSelection()}}renderBoardList();document.querySelectorAll('#component-rows tr').forEach(row=>row.classList.toggle('active-row',row.dataset.id===selectedPart));}
function installBoardGestures(){const vp=$('board-viewport');boardPointers.clear();gesture=null;const pos=e=>{const b=vp.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};const snapshot=()=>{const pts=[...boardPointers.values()];return{view:{...mapView},pts,center:pts.length===2?{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2}:pts[0],distance:pts.length===2?Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y):0}};

 vp.onpointermove=e=>{if(!boardPointers.has(e.pointerId))return;boardPointers.set(e.pointerId,pos(e));const pts=[...boardPointers.values()];if(pts.length===1&&gesture.pts.length===1){const dx=pts[0].x-gesture.center.x,dy=pts[0].y-gesture.center.y;if(Math.hypot(dx,dy)>5)moved=true;mapView.x=gesture.view.x+dx;mapView.y=gesture.view.y+dy;applyBoardView()}else if(pts.length===2&&gesture.pts.length===2){moved=true;const cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2,dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);mapView={...gesture.view};setZoom(gesture.view.scale*dist/Math.max(1,gesture.distance),gesture.center.x,gesture.center.y);mapView.x+=cx-gesture.center.x;mapView.y+=cy-gesture.center.y;applyBoardView()}};
